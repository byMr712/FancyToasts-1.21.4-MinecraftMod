plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com'
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    modImplementation("com.terraformersmc:modmenu:${project.fabric_modmenu_version}")
    modCompileOnly("maven.modrinth:jade:${project.fabric_jade_version}")
}

remapJar {
    destinationDirectory = rootProject.file('build/libs')
    archiveFileName = "FancyToasts-1.21.4-byMr712.jar"
}

def launcherModsDir = file("E:/ATLauncher/instances/FabulouslyOptimizedFPStest1214/mods")

tasks.register('copyToLauncher', Copy) {
    onlyIf {
        launcherModsDir.exists()
    }
    dependsOn remapJar
    from remapJar.archiveFile
    into launcherModsDir
    doLast {
        println ">>> Copied ${remapJar.archiveFileName.get()} to ATLauncher instance mods folder!"
    }
}

if (launcherModsDir.exists()) {
    build.finalizedBy(copyToLauncher)
}


loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
